<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Assurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233F;
    --navy-light: #24345A;
    --paper: #EAEDF1;
    --card: #FFFFFF;
    --brass: #A9822C;
    --approved: #3F7D58;
    --approved-bg: #E7F1EA;
    --rejected: #A23E32;
    --rejected-bg: #F5E7E5;
    --ink: #2B303B;
    --ink-soft: #6B7280;
    --border: #DADFE6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 3px solid var(--brass);
  }

  header .badge {
    width: 34px;
    height: 34px;
    border: 2px solid var(--brass);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    color: var(--brass);
    font-size: 15px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 0;
    font-size: 12.5px;
    color: #A9B4C9;
    font-family: 'IBM Plex Mono', monospace;
  }

  main {
    flex: 1;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 20px 140px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty-state {
    margin-top: 60px;
    text-align: center;
    color: var(--ink-soft);
  }

  .empty-state .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 8px;
  }

  .empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    color: var(--navy);
    margin: 0 0 6px;
  }

  .row { display: flex; width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble-user {
    background: var(--navy);
    color: #fff;
    padding: 12px 16px;
    border-radius: 14px 14px 3px 14px;
    max-width: 72%;
    font-size: 15px;
    line-height: 1.45;
  }

  .dossier {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px 14px 14px 14px;
    max-width: 82%;
    padding: 16px 18px;
    position: relative;
    box-shadow: 0 1px 2px rgba(22,35,63,0.06);
  }

  .dossier .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .dossier pre {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    background: var(--paper);
    padding: 12px 14px;
    border-radius: 6px;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--navy);
    border-left: 3px solid var(--brass);
  }

  .dossier .error-text {
    font-size: 14px;
    color: var(--rejected);
    line-height: 1.5;
  }

  .dossier table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 13.5px;
  }

  .dossier th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  .dossier td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
  }

  .dossier .results-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .stamp {
    position: absolute;
    top: -10px;
    right: -8px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 1px;
    padding: 5px 10px;
    border-radius: 4px;
    transform: rotate(6deg);
    border: 2px solid currentColor;
  }

  .stamp.approved { color: var(--approved); background: var(--approved-bg); }
  .stamp.rejected { color: var(--rejected); background: var(--rejected-bg); }

  .thinking {
    display: flex;
    gap: 5px;
    padding: 6px 4px;
  }
  .thinking span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brass);
    opacity: 0.4;
    animation: pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  form {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    padding: 24px 20px 22px;
  }

  .input-bar {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px 6px 16px;
    box-shadow: 0 4px 14px rgba(22,35,63,0.10);
  }

  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    padding: 10px 0;
  }

  input[type="text"]::placeholder { color: var(--ink-soft); }

  button {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--navy-light); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    .thinking span { animation: none; opacity: 0.7; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">AA</div>
  <div>
    <h1>Agent Assurance</h1>
    <p>Question en langage naturel → SQL vérifié</p>
  </div>
</header>

<main id="chat">
  <div class="empty-state" id="empty-state">
    <div class="eyebrow">Dossier vide</div>
    <h2>Posez votre première question</h2>
  </div>
</main>

<form id="chat-form">
  <div class="input-bar">
    <input type="text" id="question-input" placeholder="Ex : je veux tous les utilisateurs de Casablanca" autocomplete="off" required>
    <button type="submit" id="send-btn">Envoyer</button>
  </div>
</form>

<script>
  const form = document.getElementById('chat-form');
  const input = document.getElementById('question-input');
  const chat = document.getElementById('chat');
  const emptyState = document.getElementById('empty-state');
  const sendBtn = document.getElementById('send-btn');

  function addUserRow(text) {
    emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble-user"></div>`;
    row.querySelector('.bubble-user').textContent = text;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function addThinkingRow() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `<div class="dossier"><div class="thinking"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function buildResultsTable(results) {
    if (!results || results.length === 0) return '';
    const columns = Object.keys(results[0]);
    const head = columns.map(c => `<th>${c}</th>`).join('');
    const rows = results.map(r =>
      `<tr>${columns.map(c => `<td>${r[c]}</td>`).join('')}</tr>`
    ).join('');
    return `
      <table>
        <thead><tr>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="results-note">Données mock — PostgreSQL pas encore branché</div>`;
  }

  function renderResult(row, data) {
    const ok = !!data.sql;
    row.innerHTML = `
      <div class="dossier">
        <span class="stamp ${ok ? 'approved' : 'rejected'}">${ok ? 'VALIDÉ' : 'REJETÉ'}</span>
        <div class="label">${ok ? 'Requête SQL générée' : 'Requête refusée'}</div>
        ${ok
          ? `<pre></pre>${buildResultsTable(data.results)}`
          : `<div class="error-text"></div>`}
      </div>`;
    const target = row.querySelector(ok ? 'pre' : '.error-text');
    target.textContent = ok ? data.sql : (data.error || 'Erreur inconnue.');
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addUserRow(question);
    input.value = '';
    sendBtn.disabled = true;
    const thinkingRow = addThinkingRow();

    try {
      const res = await fetch('http://localhost:8080/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      renderResult(thinkingRow, data);
    } catch (err) {
      renderResult(thinkingRow, { error: "Impossible de contacter le serveur." });
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
