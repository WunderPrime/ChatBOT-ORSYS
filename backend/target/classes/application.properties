# Port du serveur Spring Boot
server.port=8080

# URL de ton API Python (Flask). Si Python tourne en local hors Docker :
python.api.url=http://localhost:5001/api/generate-sql

# Si un jour Spring Boot ET Python tournent tous les deux dans Docker
# (via le meme docker-compose.yml), remplace par le nom du service, ex :
# python.api.url=http://chatbot:5000/api/generate-sql

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

